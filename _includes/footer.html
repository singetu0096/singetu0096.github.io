<footer class="site-footer">
  <div class="shell footer-inner">
    <div>
      <p class="footer-title">{{ site.title }}</p>
      <p class="footer-copy">ポートフォリオ、writeup、ブログをまとめた個人サイトです。</p>
    </div>

    <div class="footer-links">
      <a href="{{ '/portfolio/' | relative_url }}">Portfolio</a>
      <a href="{{ '/blog/' | relative_url }}?tag=writeup">Writeups</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
    </div>
  </div>

  <div class="shell footer-meta">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</span>
    <span>Portfolio / Writeups / Blog</span>
  </div>
</footer>
